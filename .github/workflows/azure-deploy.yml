# Azure Container Apps Deployment Pipeline
#
# Prerequisites:
# 1. Create Azure resources (see MEDICAL_PARSER_GUIDE.md Section 13.5)
# 2. Add GitHub secrets:
#    - AZURE_CREDENTIALS: Service principal JSON
#    - ACR_LOGIN_SERVER: e.g., acrmedicalparser.azurecr.io
#    - ACR_USERNAME: ACR admin username
#    - ACR_PASSWORD: ACR admin password
#
# To create AZURE_CREDENTIALS:
#   az ad sp create-for-rbac --name "github-actions-medical-parser" \
#     --role contributor \
#     --scopes /subscriptions/{subscription-id}/resourceGroups/{resource-group} \
#     --sdk-auth

name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/jsonTemplates/**'
      - 'gui/**'
      - 'Dockerfile.azure'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:  # Allow manual trigger

env:
  CONTAINER_APP_NAME: medical-invoice-parser
  RESOURCE_GROUP: rg-medical-parser
  IMAGE_NAME: medical-invoice-parser

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group api --group llm --group dev

      - name: Run tests
        run: uv run pytest tests/test_parser.py tests/test_inference.py tests/test_stress.py -v

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.azure
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Application URL: https://$APP_URL"

          # Health check
          sleep 30
          curl -f "https://$APP_URL/health" || exit 1
          echo "Health check passed!"
